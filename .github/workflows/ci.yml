name: Yorkstead Operations CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify Quality Gates, PostgreSQL Migrations & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: yorkstead_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies (Frozen Lockfile)
        run: bun install --frozen-lockfile

      - name: TypeScript Typecheck
        run: bun run typecheck

      - name: ESLint Code Quality Gate
        run: bun run lint

      - name: Automated Unit & Domain Test Suite
        run: bun test

      - name: Offline Migration File Integrity Check
        run: bun run db:migrate:check-files

      - name: Install Better Auth Database Schema
        run: bun run auth:migrate
        env:
          DATABASE_URL: "postgresql://postgres:postgres_ci_password@localhost:5432/yorkstead_ci_test"
          BETTER_AUTH_SECRET: "ci_synthetic_test_secret_32_characters_min_entropy_key"
          BETTER_AUTH_URL: "http://127.0.0.1:3000"
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      - name: Run PostgreSQL Migration Suite (First Pass - All 13 Migrations)
        run: bun run db:migrate
        env:
          DATABASE_URL: "postgresql://postgres:postgres_ci_password@localhost:5432/yorkstead_ci_test"

      - name: Run PostgreSQL Migration Suite (Second Pass - Idempotency Verification)
        run: bun run db:migrate
        env:
          DATABASE_URL: "postgresql://postgres:postgres_ci_password@localhost:5432/yorkstead_ci_test"

      - name: Verify Live Migration Ledger Status
        run: bun run db:migrate:check-live
        env:
          DATABASE_URL: "postgresql://postgres:postgres_ci_password@localhost:5432/yorkstead_ci_test"

      - name: PostgreSQL Repository Integration Tests
        run: bun run test:integration
        env:
          RUN_DATABASE_INTEGRATION: "1"
          DATABASE_URL: "postgresql://postgres:postgres_ci_password@localhost:5432/yorkstead_ci_test"

      - name: Install Chromium for Browser Smoke Tests
        run: bun x playwright install --with-deps chromium

      - name: Browser Smoke and Authorization Boundary Tests
        run: bun run test:e2e
        env:
          DATABASE_URL: "postgresql://postgres:postgres_ci_password@localhost:5432/yorkstead_ci_test"
          BETTER_AUTH_SECRET: "ci_synthetic_test_secret_32_characters_min_entropy_key"
          BETTER_AUTH_URL: "http://127.0.0.1:3000"
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      - name: Dependency Security Audit
        run: bun audit

      - name: Next.js Production Build
        run: bun run build
        env:
          NEXT_PUBLIC_APP_NAME: "Yorkstead Operations"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          DATABASE_URL: "postgresql://postgres:postgres_ci_password@localhost:5432/yorkstead_ci_test"
          BETTER_AUTH_SECRET: "ci_synthetic_test_secret_32_characters_min_entropy_key"
          BETTER_AUTH_URL: "http://localhost:3000"
